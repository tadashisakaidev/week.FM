<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>week.FM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080c;
    --text: #e8e8ee;
    --muted: #8b8fa0;
    --accent: #e11d2e;
    --panel: rgba(255, 255, 255, .06);
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    min-height: 100vh;
  }

  /* ---------- FUNDO ANIMADO ----------
     Três "manchas" coloridas desfocadas que flutuam devagar.
     Só usa transform => leve, roda liso até em celular. */
  .bg { position: fixed; inset: 0; overflow: hidden; z-index: -1; }
  .blob {
    position: absolute;
    width: 55vmax; height: 55vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: .55;
    will-change: transform, scale;
    transition: background 1.5s;
    scale: calc(1 + var(--pulse, 0) * .35);
  }
  .blob.a { background: var(--c1, #1d3a6b); top: -20%; left: -15%; animation: driftA 26s ease-in-out infinite alternate; }
  .blob.b { background: var(--c2, #3b1d4a); bottom: -25%; right: -15%; animation: driftB 32s ease-in-out infinite alternate; }
  .blob.c { background: var(--c3, #7a1220); width: 35vmax; height: 35vmax; top: 35%; left: 40%; opacity: .35; animation: driftC 22s ease-in-out infinite alternate; }
  @keyframes driftA { to { transform: translate(25vw, 20vh) scale(1.2); } }
  @keyframes driftB { to { transform: translate(-30vw, -15vh) scale(.9); } }
  @keyframes driftC { to { transform: translate(-20vw, 15vh) scale(1.3); } }
  @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }

  /* ---------- LAYOUT ---------- */
  .wrap { max-width: 940px; margin: 0 auto; padding: 32px 20px 56px; }
  h1 { font: 600 2rem 'Fraunces', serif; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); font-size: .85rem; margin: 2px 0 28px; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .controls input, .controls select {
    height: 38px; border-radius: 6px; border: 0; font: inherit; font-size: .9rem; padding: 0 12px;
  }
  .controls input { flex: 1 1 220px; background: #e8eefc; color: #111; }
  .controls select { background: #1a1c24; color: var(--text); border: 1px solid #2c2f3b; }
  button {
    font: inherit; font-weight: 700; font-size: .9rem; color: #fff; background: var(--accent);
    border: 0; border-radius: 6px; padding: 0 16px; height: 38px; cursor: pointer;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: .5; cursor: wait; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .toggles { display: flex; gap: 18px; margin: 18px 0 12px; font-size: .88rem; color: var(--muted); }
  .toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggles input { accent-color: var(--accent); }

  .main { display: grid; grid-template-columns: minmax(0, 500px) minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 800px) { .main { grid-template-columns: 1fr; } }

  canvas { width: 100%; height: auto; display: block; border-radius: 4px; background: #111; cursor: pointer; }
  .status { color: var(--muted); font-size: .9rem; padding: 40px 0; }
  .status.err { color: #ff6b78; }
  .dl { margin-top: 14px; }

  /* ---------- DESTAQUE ---------- */
  .feature {
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-radius: 14px; padding: 22px; display: flex; gap: 18px; align-items: flex-end;
  }
  .feature img { width: 100px; height: 100px; border-radius: 4px; object-fit: cover; background: #222; flex: none; }
  .feature .rank { color: var(--muted); font-size: .72rem; margin-bottom: 6px; }
  .feature h2 { font-size: 1.15rem; margin: 0 0 2px; }
  .feature .artist { color: var(--muted); font-size: .9rem; }
  .feature .plays { color: #ff6b78; font-weight: 700; font-size: .85rem; margin: 8px 0 12px; }
  .feature a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; font-size: .85rem; padding: 9px 14px; border-radius: 6px; }
  [hidden] { display: none !important; }

  .media { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .media .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .media .track { font-size: .9rem; }
  .ghost { background: #1a1c24; border: 1px solid #2c2f3b; }
  .hint { color: var(--muted); font-size: .8rem; }
  footer { text-align: center; color: #555a6b; font-size: .75rem; margin-top: 48px; }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div></div>

<div class="wrap">
  <h1>week<span>.FM</span></h1>
  <p class="sub">gera colagem com seus álbuns mais ouvidos</p>

  <div class="controls">
    <input id="user" placeholder="seu usuário do Last.fm" autocomplete="off" spellcheck="false" aria-label="usuário do Last.fm">
    <select id="period" aria-label="período">
      <option value="7day">7 dias</option>
      <option value="1month">1 mês</option>
      <option value="3month">3 meses</option>
      <option value="6month">6 meses</option>
      <option value="12month">12 meses</option>
      <option value="overall">sempre</option>
    </select>
    <select id="size" aria-label="tamanho da grade">
      <option value="3">3x3</option><option value="4">4x4</option>
      <option value="5" selected>5x5</option><option value="6">6x6</option><option value="7">7x7</option>
    </select>
    <button id="go">gerar</button>
  </div>

  <div class="toggles">
    <label><input type="checkbox" id="showText" checked> mostrar texto</label>
    <label><input type="checkbox" id="showPlays" checked> mostrar plays</label>
  </div>

  <div class="main">
    <div>
      <div id="status" class="status" role="status">digite um usuário e clique em gerar.</div>
      <canvas id="cv" hidden></canvas>
      <button id="dl" class="dl" hidden>baixar PNG (alta resolução)</button>
      <div id="media" class="media" hidden>
        <div class="track" id="trackInfo"></div>
        <div class="row">
          <button id="mute" class="ghost">silenciar</button>
          <button id="share" class="ghost">copiar link</button>
          <button data-fmt="9x16">vídeo 9:16</button>
          <button data-fmt="1x1">vídeo 1:1</button>
        </div>
        <div class="hint" id="expHint">vídeo de 15s com o fundo animado e a música.</div>
      </div>
    </div>

    <aside id="feature" class="feature" hidden>
      <img id="fImg" alt="">
      <div>
        <div class="rank" id="fRank"></div>
        <h2 id="fName"></h2>
        <div class="artist" id="fArtist"></div>
        <div class="plays" id="fPlays"></div>
        <a id="fLink" target="_blank" rel="noopener">assistir no YouTube</a>
      </div>
    </aside>
  </div>

  <footer>feito por Tadashi Sakairi :3</footer>
</div>

<script>
const $ = (s) => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d');
let OUT = 1500; // largura da colagem na tela (o download usa 3000)
let albums = [], imgs = [], n = 5;

const proxied = (u) => `/api/img?url=${encodeURIComponent(u)}`;
const setStatus = (msg, err = false) => {
  const s = $('#status'); s.textContent = msg; s.className = 'status' + (err ? ' err' : ''); s.hidden = !msg;
};

function loadImg(url) {
  return new Promise((ok) => {
    if (!url) return ok(null);
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => ok(im);
    im.onerror = () => ok(null);
    im.src = proxied(url);
  });
}

async function generate() {
  const user = $('#user').value.trim();
  if (!user) return setStatus('digite um usuário do Last.fm.', true);
  n = +$('#size').value;
  $('#go').disabled = true;
  initAudio();
  setStatus('carregando…');
  try {
    const r = await fetch(`/api/albums?user=${encodeURIComponent(user)}&period=${$('#period').value}&limit=${n * n}`);
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'erro inesperado');
    if (!data.albums.length) throw new Error('nenhum álbum encontrado nesse período.');
    albums = data.albums;
    imgs = await Promise.all(albums.map((a) => loadImg(a.cover)));
    await document.fonts.load('700 20px "DM Sans"');
    setStatus('');
    cv.hidden = $('#dl').hidden = $('#media').hidden = false;
    draw();
    highlight(0);
    loadTrack(user);
    if (imgs[0]) setPalette(paletteFrom(imgs[0]));
    history.replaceState(null, '', `?user=${encodeURIComponent(user)}&period=${$('#period').value}&size=${n}`);
  } catch (e) {
    setStatus(e.message, true);
    cv.hidden = $('#dl').hidden = $('#media').hidden = $('#feature').hidden = true;
  } finally {
    $('#go').disabled = false;
  }
}

function fit(text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  while (text.length > 1 && ctx.measureText(text + '…').width > maxW) text = text.slice(0, -1);
  return text.trimEnd() + '…';
}

function draw() {
  const t = OUT / n;                       // tamanho de cada capa
  const fs = Math.max(t * 0.075, 11);      // fonte proporcional
  cv.width = cv.height = OUT;
  ctx.imageSmoothingQuality = 'high';
  const showText = $('#showText').checked, showPlays = $('#showPlays').checked;

  albums.forEach((a, i) => {
    const x = (i % n) * t, y = Math.floor(i / n) * t;
    if (imgs[i]) ctx.drawImage(imgs[i], x, y, t, t);
    else { ctx.fillStyle = '#1b1d26'; ctx.fillRect(x, y, t, t); }

    if (!showText && !showPlays) return;
    const g = ctx.createLinearGradient(0, y + t * 0.6, 0, y + t);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.85)');
    ctx.fillStyle = g; ctx.fillRect(x, y + t * 0.6, t, t * 0.4);

    const pad = fs * 0.5, maxW = t - pad * 2;
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
    const sub = [showText ? a.artist : '', showPlays ? `${a.plays} plays` : ''].filter(Boolean).join(' · ');
    let yy = y + t - pad;
    if (sub) {
      ctx.font = `400 ${fs * 0.85}px "DM Sans", sans-serif`; ctx.fillStyle = 'rgba(255,255,255,.7)';
      ctx.fillText(fit(sub, maxW), x + pad, yy); yy -= fs * 1.15;
    }
    if (showText) {
      ctx.font = `700 ${fs}px "DM Sans", sans-serif`; ctx.fillStyle = '#fff';
      ctx.fillText(fit(a.name, maxW), x + pad, yy);
    }
  });
}

function highlight(i) {
  const a = albums[i]; if (!a) return;
  $('#feature').hidden = false;
  $('#fImg').src = a.cover ? proxied(a.cover) : '';
  $('#fRank').textContent = `#${i + 1} do período`;
  $('#fName').textContent = a.name;
  $('#fArtist').textContent = a.artist;
  $('#fPlays').textContent = `${a.plays} plays`;
  $('#fLink').href = `https://www.youtube.com/results?search_query=${encodeURIComponent(a.artist + ' ' + a.name)}`;
}

cv.addEventListener('click', (e) => {
  const r = cv.getBoundingClientRect();
  const col = Math.floor(((e.clientX - r.left) / r.width) * n);
  const row = Math.floor(((e.clientY - r.top) / r.height) * n);
  const i = row * n + col; highlight(i); playAlbum(i);
});

/* ---------- ÁUDIO + VÍDEO ---------- */
let ac, mainGain, analyser, mainSrc, srcGain, pal = ['29,58,107', '70,30,90', '170,20,40'], track = null, buf = null, muted = false, gen = 0;
const DUR = 15;      // segundos de vídeo
const VOL = 0.3;     // volume geral (0 a 1)
const FADE = 4;      // segundos pra música entrar
const FMT = { '9x16': [1080, 1920], '1x1': [1080, 1080] };

function initAudio() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    analyser = ac.createAnalyser(); analyser.fftSize = 256;
    mainGain = ac.createGain(); mainGain.gain.value = VOL;
    analyser.connect(mainGain); mainGain.connect(ac.destination);
    pulseLoop();
  }
  ac.resume();
}
const level = (an) => { const d = new Uint8Array(an.frequencyBinCount); an.getByteFrequencyData(d); let s = 0; for (let i = 0; i < 8; i++) s += d[i]; return s / 8 / 255; };
function pulseLoop() {
  document.documentElement.style.setProperty('--pulse', mainSrc ? level(analyser).toFixed(3) : 0);
  requestAnimationFrame(pulseLoop);
}

async function loadTrack(user) {
  const me = ++gen;
  if (mainSrc) { mainSrc.stop(); mainSrc = null; }
  track = buf = null;
  $('#trackInfo').textContent = '';
  try {
    const r = await fetch(`/api/track?user=${encodeURIComponent(user)}&period=${$('#period').value}`);
    const { track: t } = await r.json();
    if (me !== gen || !t) return;
    track = t;
    $('#trackInfo').textContent = `♪ ${t.name} — ${t.artist}` + (t.preview ? '' : ' (sem prévia disponível)');
    if (!t.preview) return;
    const ab = await (await fetch('/api/audio?url=' + encodeURIComponent(t.preview))).arrayBuffer();
    const decoded = await ac.decodeAudioData(ab);
    if (me !== gen) return;
    buf = decoded;
    playBuf(buf);
  } catch { /* sem áudio: o site continua funcionando */ }
}

function fitOn(c, text, maxW) {
  if (c.measureText(text).width <= maxW) return text;
  while (text.length > 1 && c.measureText(text + '…').width > maxW) text = text.slice(0, -1);
  return text.trimEnd() + '…';
}

function paintFrame(c, W, H, t, p, user, per) {
  // fundo: 3 manchas que andam e crescem com o grave
  c.fillStyle = '#07080c'; c.fillRect(0, 0, W, H);
  [[pal[0], .2, .2, .6, 1], [pal[1], .8, .85, .6, .7], [pal[2], .5, .55, .4, 1.1]].forEach(([rgb, x, y, r, sp], i) => {
    const cx = W * (x + Math.sin(t * .4 * sp + i * 2) * .2), cy = H * (y + Math.cos(t * .35 * sp + i) * .15);
    const rad = Math.max(W, H) * r * (1 + p * .35);
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, rad);
    g.addColorStop(0, `rgba(${rgb},.8)`); g.addColorStop(1, `rgba(${rgb},0)`);
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  });

  const tall = H > W, size = tall ? 960 : 740, x = (W - size) / 2, y = tall ? 330 : 135;
  // logo
  const f = tall ? 84 : 56, ty = tall ? 200 : 88;
  c.textAlign = 'left'; c.font = `600 ${f}px Fraunces, serif`;
  const w1 = c.measureText('week').width, w2 = c.measureText('.FM').width, sx = (W - w1 - w2) / 2;
  c.fillStyle = '#fff'; c.fillText('week', sx, ty);
  c.fillStyle = '#e11d2e'; c.fillText('.FM', sx + w1, ty);
  // colagem (pulsa de leve)
  c.save();
  c.translate(W / 2, y + size / 2); c.scale(1 + p * .025, 1 + p * .025); c.translate(-W / 2, -(y + size / 2));
  c.beginPath(); c.roundRect(x, y, size, size, 18); c.clip();
  c.drawImage(cv, x, y, size, size);
  c.restore();
  // textos
  c.textAlign = 'center';
  const lines = track ? [`♪ ${track.name}`, track.artist, `@${user} · ${per}`] : [`@${user}`, per];
  let yy = y + size + (tall ? 120 : 62);
  lines.forEach((s, i) => {
    const fs = (tall ? [50, 38, 32] : [34, 28, 24])[i];
    c.font = `${i ? 400 : 700} ${fs}px "DM Sans", sans-serif`;
    c.fillStyle = i ? 'rgba(255,255,255,.65)' : '#fff';
    c.fillText(fitOn(c, s, W - 120), W / 2, yy); yy += fs * 1.45;
  });
}

async function exportVideo(fmt) {
  if (!albums.length) return;
  if (!window.MediaRecorder) return ($('#expHint').textContent = 'seu navegador não grava vídeo. Use Chrome, Edge ou Firefox.');
  const [W, H] = FMT[fmt], user = $('#user').value.trim(), per = $('#period').selectedOptions[0].text;
  const btns = document.querySelectorAll('[data-fmt]'); btns.forEach((b) => (b.disabled = true));
  await document.fonts.load('600 40px Fraunces'); await document.fonts.load('700 40px "DM Sans"');
  initAudio();

  const vc = document.createElement('canvas'); vc.width = W; vc.height = H;
  const c = vc.getContext('2d'), stream = vc.captureStream(30);
  let src = null, an = analyser;
  if (buf) {
    const dest = ac.createMediaStreamDestination();
    an = ac.createAnalyser(); an.fftSize = 256;
    src = ac.createBufferSource(); src.buffer = buf;
    const eg = ac.createGain(), T = ac.currentTime;   // fade de 1s no começo e no fim
    eg.gain.setValueAtTime(0, T); eg.gain.linearRampToValueAtTime(1, T + 1);
    eg.gain.setValueAtTime(1, T + DUR - 1); eg.gain.linearRampToValueAtTime(0, T + DUR);
    src.connect(eg); eg.connect(an); an.connect(dest);
    stream.addTrack(dest.stream.getAudioTracks()[0]);
  }
  mainGain.gain.value = 0; // não toca em dobro nos alto-falantes enquanto grava
  const mime = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4',
    'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  const mr = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8e6 }), chunks = [];
  mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  const stopped = new Promise((r) => (mr.onstop = r));

  mr.start(); if (src) src.start();
  const t0 = performance.now();
  await new Promise((done) => {
    const tick = () => {
      const t = (performance.now() - t0) / 1000;
      paintFrame(c, W, H, t, src ? level(an) : 0, user, per);
      $('#expHint').textContent = `gravando… mantenha esta aba aberta (${Math.ceil(DUR - t)}s)`;
      t < DUR ? requestAnimationFrame(tick) : done();
    };
    tick();
  });
  mr.stop(); try { src && src.stop(); } catch {}
  await stopped;

  mainGain.gain.value = muted ? 0 : VOL;
  btns.forEach((b) => (b.disabled = false));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(chunks, { type: mime.split(';')[0] }));
  a.download = `weekfm-${user}-${fmt}.${ext}`; a.click();
  $('#expHint').textContent = ext === 'mp4' ? 'pronto! vídeo MP4 em Full HD baixado.' : 'pronto! seu navegador só gravou .webm. Chrome ou Edge atualizados gravam MP4.';
}

document.querySelectorAll('[data-fmt]').forEach((b) => b.addEventListener('click', () => exportVideo(b.dataset.fmt)));
$('#mute').addEventListener('click', () => {
  muted = !muted; mainGain.gain.value = muted ? 0 : VOL;
  $('#mute').textContent = muted ? 'ligar som' : 'silenciar';
});

/* ---------- CORES DA CAPA ---------- */
function paletteFrom(im) {
  const S = 24, t = document.createElement('canvas'); t.width = t.height = S;
  const x = t.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, S, S);
  const d = x.getImageData(0, 0, S, S).data, bins = {};
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], g = d[i + 1], b = d[i + 2], k = (r >> 5) + ',' + (g >> 5) + ',' + (b >> 5);
    const w = Math.max(r, g, b) - Math.min(r, g, b) + 12;         // cores vivas pesam mais
    const o = (bins[k] = bins[k] || { r: 0, g: 0, b: 0, w: 0 });
    o.r += r * w; o.g += g * w; o.b += b * w; o.w += w;
  }
  const cols = Object.values(bins).sort((a, b) => b.w - a.w).map((o) => [o.r / o.w, o.g / o.w, o.b / o.w]);
  const out = [];
  for (const c of cols) {
    if (out.every((o) => Math.abs(o[0] - c[0]) + Math.abs(o[1] - c[1]) + Math.abs(o[2] - c[2]) > 120)) out.push(c);
    if (out.length === 3) break;
  }
  while (out.length < 3) out.push(out[0] || [40, 60, 110]);
  return out.map((c) => { const k = 130 / Math.max(...c, 1); return c.map((v) => Math.round(v * k)).join(','); });
}
function setPalette(p) {
  pal = p;
  p.forEach((c, i) => document.documentElement.style.setProperty('--c' + (i + 1), `rgb(${c})`));
}

/* ---------- TOCAR COM FADE ---------- */
function playBuf(b) {
  const old = mainSrc, oldG = srcGain, t = ac.currentTime;
  if (old) { oldG.gain.setTargetAtTime(0, t, .2); setTimeout(() => { try { old.stop(); } catch {} }, 1500); }
  srcGain = ac.createGain();
  srcGain.gain.setValueAtTime(0, t);
  srcGain.gain.linearRampToValueAtTime(1, t + FADE);   // entra devagar
  mainSrc = ac.createBufferSource(); mainSrc.buffer = b; mainSrc.loop = true;
  mainSrc.connect(srcGain); srcGain.connect(analyser); mainSrc.start();
}

async function playAlbum(i) {
  const a = albums[i]; if (!a || !ac) return;
  ac.resume();
  const me = ++gen;
  try {
    const j = await (await fetch(`/api/preview?artist=${encodeURIComponent(a.artist)}&album=${encodeURIComponent(a.name)}`)).json();
    if (me !== gen) return;
    if (!j.preview) { $('#trackInfo').textContent = `♪ sem prévia pra "${a.name}"`; return; }
    const b = await ac.decodeAudioData(await (await fetch('/api/audio?url=' + encodeURIComponent(j.preview))).arrayBuffer());
    if (me !== gen) return;
    $('#trackInfo').textContent = `♪ ${j.name} — ${a.artist}`;
    playBuf(b);
  } catch { /* segue sem áudio */ }
}

$('#go').addEventListener('click', generate);
$('#user').addEventListener('keydown', (e) => e.key === 'Enter' && generate());
$('#showText').addEventListener('change', () => albums.length && draw());
$('#showPlays').addEventListener('change', () => albums.length && draw());
$('#dl').addEventListener('click', async () => {
  const btn = $('#dl'), label = btn.textContent;
  btn.disabled = true; btn.textContent = 'preparando…';
  const small = imgs;
  // tenta capas maiores (770px); se alguma falhar, usa a de 300px que já temos
  const big = await Promise.all(albums.map((a, i) => loadImg(a.cover.replace('/300x300/', '/770x0/')).then((im) => im || small[i])));
  imgs = big; OUT = 3000; draw();
  const url = cv.toDataURL('image/png');
  imgs = small; OUT = 1500; draw();
  const a = document.createElement('a');
  a.download = `weekfm-${$('#user').value.trim()}.png`;
  a.href = url; a.click();
  btn.disabled = false; btn.textContent = label;
});
$('#share').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(location.href); $('#expHint').textContent = 'link copiado!'; }
  catch { $('#expHint').textContent = 'copie o endereço na barra do navegador.'; }
});

// abre direto a colagem se o link tiver ?user=
const qp = new URLSearchParams(location.search);
if (qp.get('user')) {
  $('#user').value = qp.get('user');
  if (qp.get('period')) $('#period').value = qp.get('period');
  if (qp.get('size')) $('#size').value = qp.get('size');
  if (!$('#period').value) $('#period').value = '7day';
  if (!$('#size').value) $('#size').value = '5';
  document.addEventListener('click', () => ac && ac.resume(), { once: true }); // navegador só libera som após um clique
  generate();
}
</script>
</body>

</html>
